name: Android APK

# Builds the Capacitor Android artifacts for both editions.
# - workflow_dispatch: manual test builds (artifacts only)
# - tags android/v*: artifacts + attach them to the matching release
#
# Artifacts per edition:
#   - debug APK     → always (sideload testing, debug-signed)
#   - release APK   → when the ANDROID_KEYSTORE_BASE64 secret is set
#   - release AAB   → when the keystore is present (Play Store format)
#
# Zero-internet guardrail: after each build we dump EVERY produced APK's
# merged manifest permissions and FAIL if android.permission.INTERNET is
# present. The local-only promise is enforced here, not just documented.
#
# Signing (optional-secrets pattern): when ALL FOUR repo secrets
# KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD are set,
# the keystore is decoded into $RUNNER_TEMP and the release build receives
# -PgcKeystoreFile/-PgcKeystorePassword/-PgcKeyAlias/-PgcKeyPassword (see
# capacitor/android/app/build.gradle). The legacy ANDROID_-prefixed secret
# names are still honoured as a fallback. Without the secrets the job ships
# debug artifacts only and prints a notice — it never hard-blocks.

on:
  workflow_dispatch:
  push:
    tags:
      - "android/v*"

permissions:
  contents: write # required only for attaching artifacts to a release on tag push

jobs:
  apk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: advance # GC_EDITION=pro  → GoalCheck Advance
            label: Advance
          - edition: base # GC_EDITION=base → GoalCheck
            label: ""
    name: APK (${{ matrix.edition }})
    runs-on: ubuntu-latest # GitHub runners ship JDK + the Android SDK preinstalled
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # Capacitor 7 template compiles Java at release 21 (17 fails: "invalid source release: 21")

      - name: Install web app dependencies
        run: bun install --frozen-lockfile
        # (capacitor/node_modules is installed on demand by
        # scripts/sync-capacitor.mjs — the shell is an independent project.)

      - name: Static export + sync into Capacitor shell (${{ matrix.edition }})
        run: bun run build:capacitor:${{ matrix.edition }}

      - name: Resolve release signing (optional secrets)
        id: signing
        env:
          GC_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          GC_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          GC_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          GC_KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A signing config is activated only when ALL FOUR are present —
          # partial sets are ignored (with a notice) so a half-configured
          # repo can never produce a wrongly-signed artifact.
          if [ -n "$GC_KEYSTORE_B64" ] && [ -n "$GC_KEYSTORE_PASS" ] && [ -n "$GC_KEY_ALIAS" ] && [ -n "$GC_KEY_PASS" ]; then
            # decode into RUNNER_TEMP — the keystore never touches the checkout
            echo "$GC_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gc-release.keystore.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "file=$RUNNER_TEMP/gc-release.keystore.jks" >> "$GITHUB_OUTPUT"
            echo "::notice::Release keystore restored from secrets — APK + AAB will be signed (gcKeystore* gradle properties)."
          elif [ -n "$GC_KEYSTORE_B64" ] || [ -n "$GC_KEYSTORE_PASS" ] || [ -n "$GC_KEY_ALIAS" ] || [ -n "$GC_KEY_PASS" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets incomplete — all four of KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD are required. Building unsigned (debug) artifacts only."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets configured — building unsigned (debug) artifacts. Set KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD to enable signed releases (see download/fdroid-prep.md)."
          fi

      - name: Assemble debug APK
        run: cd capacitor/android && bash ./gradlew assembleDebug --no-daemon

      - name: Assemble + bundle signed release (APK + AAB)
        if: steps.signing.outputs.signed == 'true'
        env:
          GC_KS_FILE: ${{ steps.signing.outputs.file }}
          GC_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          GC_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          GC_KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd capacitor/android
          bash ./gradlew assembleRelease bundleRelease --no-daemon \
            "-PgcKeystoreFile=$GC_KS_FILE" \
            "-PgcKeystorePassword=$GC_KS_PASS" \
            "-PgcKeyAlias=$GC_KEY_ALIAS" \
            "-PgcKeyPassword=$GC_KEY_PASS"

      - name: Zero-internet check (fail if INTERNET permission is present)
        run: |
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          echo "Using $AAPT2"
          FAILED=0
          for APK in \
            capacitor/android/app/build/outputs/apk/debug/app-debug.apk \
            capacitor/android/app/build/outputs/apk/release/app-release.apk; do
            if [ -f "$APK" ]; then
              echo "--- $APK"
              PERMS="$("$AAPT2" dump permissions "$APK")"
              echo "$PERMS"
              if echo "$PERMS" | grep -q "android.permission.INTERNET"; then
                echo "::error::$APK declares android.permission.INTERNET — zero-internet guarantee violated"
                FAILED=1
              fi
            fi
          done
          if [ "$FAILED" = "1" ]; then exit 1; fi
          echo "✓ no INTERNET permission in any merged manifest"

      - name: Collect artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp capacitor/android/app/build/outputs/apk/debug/app-debug.apk \
             GoalCheck${{ matrix.label }}-v${VERSION}-debug.apk
          if [ -f capacitor/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp capacitor/android/app/build/outputs/apk/release/app-release.apk \
               GoalCheck${{ matrix.label }}-v${VERSION}-release.apk
            cp capacitor/android/app/build/outputs/bundle/release/app-release.aab \
               GoalCheck${{ matrix.label }}-v${VERSION}.aab
          fi
          # `ls` exits 2 when a glob matches nothing (release artifacts only
          # exist when signing secrets are configured) — list each set safely.
          ls -la GoalCheck*.apk 2>/dev/null || true
          ls -la GoalCheck*.aab 2>/dev/null || true

      # `${{ github.ref_name }}` may contain "/" (android/vX.Y.Z) which is an
      # invalid artifact-name character — sanitize once, reuse everywhere.
      - name: Sanitize ref name for artifact names
        run: echo "SAFE_REF=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoalCheck${{ matrix.label }}-${{ env.SAFE_REF }}-android
          path: |
            GoalCheck*.apk
            GoalCheck*.aab
          if-no-files-found: error

      - name: Attach artifacts to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/android/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            GoalCheck*.apk
            GoalCheck*.aab
          make_latest: false # android builds attach to their own android/v* release
