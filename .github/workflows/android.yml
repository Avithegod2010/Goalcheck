name: Android APK

# Builds the Capacitor Android artifacts for both editions.
# - workflow_dispatch: manual test builds (artifacts only)
# - tags android/v*: artifacts + attach them to the matching release
#
# Artifacts per edition:
#   - debug APK     → always (sideload testing, debug-signed)
#   - release APK   → when the ANDROID_KEYSTORE_BASE64 secret is set
#   - release AAB   → when the keystore is present (Play Store format)
#
# Zero-internet guardrail: after each build we dump EVERY produced APK's
# merged manifest permissions and FAIL if android.permission.INTERNET is
# present. The local-only promise is enforced here, not just documented.
#
# Signing: keystore.properties + keystore.jks are materialized from GitHub
# Secrets (see "Restore release signing" step) or created locally — they are
# gitignored and NEVER committed. Without the secret the job still ships
# debug builds so the pipeline never hard-blocks on missing signing setup.

on:
  workflow_dispatch:
  push:
    tags:
      - "android/v*"

permissions:
  contents: write # required only for attaching artifacts to a release on tag push

jobs:
  apk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: advance # GC_EDITION=pro  → GoalCheck Advance
            label: Advance
          - edition: base # GC_EDITION=base → GoalCheck
            label: ""
    name: APK (${{ matrix.edition }})
    runs-on: ubuntu-latest # GitHub runners ship JDK + the Android SDK preinstalled
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # Capacitor 7 template compiles Java at release 21 (17 fails: "invalid source release: 21")

      - name: Install web app dependencies
        run: bun install --frozen-lockfile
        # (capacitor/node_modules is installed on demand by
        # scripts/sync-capacitor.mjs — the shell is an independent project.)

      - name: Static export + sync into Capacitor shell (${{ matrix.edition }})
        run: bun run build:capacitor:${{ matrix.edition }}

      - name: Restore release signing (from secrets, optional)
        id: keystore
        env:
          GC_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GC_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GC_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$GC_KEYSTORE_B64" ]; then
            echo "$GC_KEYSTORE_B64" | base64 -d > capacitor/android/keystore.jks
            printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$GC_KEYSTORE_PASS" "$GC_KEY_ALIAS" "$GC_KEY_PASS" \
              > capacitor/android/keystore.properties
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "✓ keystore restored — release APK + AAB will be signed"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ℹ no ANDROID_KEYSTORE_BASE64 secret — building debug artifacts only"
          fi

      - name: Assemble debug APK
        run: cd capacitor/android && bash ./gradlew assembleDebug --no-daemon

      - name: Assemble + bundle signed release (APK + AAB)
        if: steps.keystore.outputs.present == 'true'
        run: cd capacitor/android && bash ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Zero-internet check (fail if INTERNET permission is present)
        run: |
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          echo "Using $AAPT2"
          FAILED=0
          for APK in \
            capacitor/android/app/build/outputs/apk/debug/app-debug.apk \
            capacitor/android/app/build/outputs/apk/release/app-release.apk; do
            if [ -f "$APK" ]; then
              echo "--- $APK"
              PERMS="$("$AAPT2" dump permissions "$APK")"
              echo "$PERMS"
              if echo "$PERMS" | grep -q "android.permission.INTERNET"; then
                echo "::error::$APK declares android.permission.INTERNET — zero-internet guarantee violated"
                FAILED=1
              fi
            fi
          done
          if [ "$FAILED" = "1" ]; then exit 1; fi
          echo "✓ no INTERNET permission in any merged manifest"

      - name: Collect artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp capacitor/android/app/build/outputs/apk/debug/app-debug.apk \
             GoalCheck${{ matrix.label }}-v${VERSION}-debug.apk
          if [ -f capacitor/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp capacitor/android/app/build/outputs/apk/release/app-release.apk \
               GoalCheck${{ matrix.label }}-v${VERSION}-release.apk
            cp capacitor/android/app/build/outputs/bundle/release/app-release.aab \
               GoalCheck${{ matrix.label }}-v${VERSION}.aab
          fi
          ls -la GoalCheck*.apk GoalCheck*.aab 2>/dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoalCheck${{ matrix.label }}-v${{ github.ref_name }}-android
          path: |
            GoalCheck*.apk
            GoalCheck*.aab
          if-no-files-found: error

      - name: Attach artifacts to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/android/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            GoalCheck*.apk
            GoalCheck*.aab
          make_latest: false # android builds attach to their own android/v* release
