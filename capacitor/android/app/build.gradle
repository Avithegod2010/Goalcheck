apply plugin: 'com.android.application'

/* =========================================================
   Versioning + release signing — single source of truth.

   versionName / versionCode come from the REPO ROOT package.json
   (capacitor/android → ../.. = repo root), so a web release bump
   automatically versions the native shells:
     versionCode  = major*10000 + minor*100 + patch   (0.4.1 → 401)

   Release signing reads keystore.properties (gitignored) from the
   android/ root:
     storeFile=keystore.jks          (resolved against android/)
     storePassword=…
     keyAlias=…
     keyPassword=…
   CI materializes it from GitHub Secrets (see android.yml);
   locally create it via keytool (see download/ANDROID.md).
   Without it, release builds fall back to debug signing so the
   pipeline never hard-blocks on missing signing setup.
   ========================================================= */

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def packageJsonFile = rootProject.file("../../package.json")
def packageJson = new groovy.json.JsonSlurper().parse(packageJsonFile)
def gcSemver = packageJson.version.tokenize('.')
def gcVersionCode = (gcSemver[0] as Integer) * 10000 + (gcSemver[1] as Integer) * 100 + (gcSemver[2] as Integer)

def keystoreStoreFile = keystoreProps['storeFile']
def keystoreStorePassword = keystoreProps['storePassword']
def keystoreKeyAlias = keystoreProps['keyAlias']
def keystoreKeyPassword = keystoreProps['keyPassword']

def hasReleaseKeystore = keystorePropsFile.exists() && keystoreStoreFile != null

android {
    namespace "io.github.avithegod2010.goalcheckadvance"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.avithegod2010.goalcheckadvance"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode gcVersionCode
        versionName "${packageJson.version}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreStoreFile)
                storePassword keystoreStorePassword
                keyAlias keystoreKeyAlias
                keyPassword keystoreKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                // no keystore configured — debug-signed so local release
                // builds stay installable (CI attaches releases only when
                // the keystore secret is present)
                signingConfig signingConfigs.debug
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
